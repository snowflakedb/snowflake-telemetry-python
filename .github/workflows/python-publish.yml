# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

# All action refs (uses:) in this repository must be pinned to full commit
# SHAs, never mutable tags or branches, so CI and release runs are
# reproducible. tests/test_workflow_action_pinning.py enforces this in CI.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3.1.4
      with:
        python-version: '3.x'
    - name: Install dependencies
      # Pin the build toolchain so release builds are reproducible.
      # Bump deliberately.
      run: |
        python -m pip install pip==26.2.1
        pip install build==1.6.1
    - name: Build package
      run: python -m build
    - name: Record artifact digests
      # Bind the built artifacts to SHA-256 digests in the release log, so
      # the published files can later be compared against what this job
      # actually produced. Fails the release if the build produced nothing.
      run: sha256sum dist/*
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
